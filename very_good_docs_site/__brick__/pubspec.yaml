name: {{project_name.snakeCase()}}
description: {{{description}}}
version: 0.0.1
{{^publishable}}publish_to: none
{{/publishable}}
environment:
  sdk: ^3.13.0

dependencies:
  jaspr: ^0.23.4
  jaspr_content: ^0.5.4
  yaml: ^3.1.3

dev_dependencies:
  build_runner: ^2.10.0
  # Imported by nothing, but jaspr_cli compiles the client entrypoint
  # through it. Removing it breaks `jaspr build`.
  build_web_compilers: ^4.8.5
  jaspr_builder: ^0.23.4
  # Run through `dart run jaspr_cli:jaspr` so the CLI version is resolved
  # alongside jaspr instead of pinned separately.
  jaspr_cli: ^0.23.4
  jaspr_test: ^0.23.4
  mocktail: ^1.0.4
  test: ^1.30.0
  very_good_analysis: ^11.0.0

jaspr:
  mode: static
  # Emits every `@css` declaration into a single cacheable stylesheet
  # instead of inlining it into each pre-rendered page.
  styles: standalone
