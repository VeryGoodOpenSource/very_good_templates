name: main

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: "3.13.0"

      - name: 📦 Install Dependencies
        run: dart pub get

      - name: ✨ Check Formatting
        run: dart format --set-exit-if-changed .

      - name: 🕵️ Analyze
        run: dart analyze --fatal-infos --fatal-warnings .

      - name: 🧪 Run Tests
        run: dart test --test-randomize-ordering-seed random

      - name: 👷 Build website
        run: dart run jaspr_cli:jaspr build

      # jaspr build regenerates the options files from the components in use.
      # Commit the regenerated files whenever this step fails.
      - name: 🔍 Verify Generated Files
        run: git diff --exit-code lib/main.client.options.dart lib/main.server.options.dart
