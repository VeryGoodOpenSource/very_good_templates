name: very_good_docs_site

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - .github/workflows/very_good_docs_site.yaml
      - "very_good_docs_site/**"
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/very_good_docs_site.yaml
      - "very_good_docs_site/**"
    branches:
      - main

jobs:
  brick:
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: "3.13.0"

      - name: 🧱 Mason Make
        run: |
          dart pub global activate mason_cli 0.1.3
          dart pub global activate very_good_cli 1.1.1
          mason get
          mason make very_good_docs_site -c very_good_docs_site/config.json --on-conflict overwrite -o very_good_docs_site_output

      - name: 📦 Install Dependencies
        run: dart pub get --directory very_good_docs_site_output

      - name: ✨ Check Formatting
        run: dart format --set-exit-if-changed very_good_docs_site_output

      - name: 🕵️ Analyze
        run: dart analyze --fatal-infos --fatal-warnings very_good_docs_site_output

      - name: 🧪 Run Tests
        run: |
          cd very_good_docs_site_output
          very_good dart test -j 4 --optimization --min-coverage 100 --test-randomize-ordering-seed random

      - name: 👷 Build website
        run: |
          cd very_good_docs_site_output
          dart run jaspr_cli:jaspr build

      # jaspr build regenerates the options files from the components in use,
      # so the committed copies in the brick must match what it writes.
      - name: 🔍 Verify Generated Files
        run: |
          for file in main.client.options.dart main.server.options.dart; do
            diff very_good_docs_site/__brick__/lib/$file very_good_docs_site_output/lib/$file
          done
