name: bot_dependency_tightener

on:
  schedule:
    # weekly on mondays at 8 am utc
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Flutter (which includes Dart) is required to check that tightened
      # dependencies still resolve. Keep in sync with the brick workflows.
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          cache: true
          flutter-version: "3.47.x"

      - name: 📦 Install dependencies
        run: dart pub get --directory tool/dependency_tightener

      - name: 🪢 Tighten dependencies
        # SDK-pinned packages (like intl via flutter_localizations) are
        # automatically detected and skipped by the dependency tightener, as
        # are updates that would make the dependencies fail to resolve.
        shell: bash
        run: |
          bricks=(
            very_good_app_ui
            very_good_core
            very_good_dart_cli
            very_good_dart_package
            very_good_flame_game
            very_good_flutter_package
            very_good_flutter_plugin
          )
          for brick in "${bricks[@]}"; do
            dart run tool/dependency_tightener/bin/dependency_tightener.dart --directory "$brick/__brick__"
          done 2>&1 | tee "$RUNNER_TEMP/dependency_tightener.log"

      - name: 📝 Write Pull Request Body
        shell: bash
        run: |
          {
            echo "Tighten dependencies for all direct hosted dependencies in templated pubspec.yaml files."
            if grep -q '^Skipped' "$RUNNER_TEMP/dependency_tightener.log"; then
              echo
              echo "The following updates were skipped:"
              echo
              grep '^Skipped' "$RUNNER_TEMP/dependency_tightener.log" | sed 's/^/- /'
            fi
          } > "$RUNNER_TEMP/pull_request_body.md"

      - name: 🤖 Config Git User
        run: |
          git config user.name VGV Bot
          git config user.email vgvbot@users.noreply.github.com

      - name: 🤖 Create Pull Request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          base: main
          branch: vgvbot/dependency_tightener
          commit-message: "chore: tighten template dependencies"
          title: "chore: tighten template dependencies"
          body-path: ${{ runner.temp }}/pull_request_body.md
          labels: bot
          author: VGV Bot <vgvbot@users.noreply.github.com>
          assignees: vgvbot
          committer: VGV Bot <vgvbot@users.noreply.github.com>
