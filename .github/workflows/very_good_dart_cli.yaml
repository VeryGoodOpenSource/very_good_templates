name: very_good_dart_cli

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - .github/workflows/very_good_dart_cli.yaml
      - "very_good_dart_cli/**"
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/very_good_dart_cli.yaml
      - "very_good_dart_cli/**"
    branches:
      - main

jobs:
  brick:
    name: brick (${{ matrix.variant }})

    defaults:
      run:
        working-directory: very_good_dart_cli/

    strategy:
      fail-fast: false
      matrix:
        include:
          # A standalone package: the generated package is the repository root.
          - variant: default
            config: config.json
            output: very_good_dart_cli_output
            resolve_in: very_good_dart_cli_output
          # A package resolving from a parent Pub workspace. Generated into a
          # subdirectory of a workspace root so `resolution: workspace` and the
          # `ensure_build` check are exercised the way real consumers hit them.
          - variant: workspace
            config: config_workspace.json
            output: very_good_dart_cli_workspace_output/very_good_dart_cli_output
            resolve_in: very_good_dart_cli_workspace_output

    runs-on: ubuntu-latest

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: "3.13.0"

      - name: 🏗️ Create Parent Workspace
        if: matrix.variant == 'workspace'
        run: |
          mkdir -p very_good_dart_cli_workspace_output
          cat > very_good_dart_cli_workspace_output/pubspec.yaml <<'EOF'
          name: _very_good_dart_cli_workspace_root
          publish_to: none

          environment:
            sdk: ^3.13.0

          workspace:
            - very_good_dart_cli_output
          EOF

      - name: 🧱 Mason Make
        run: |
          dart pub global activate mason_cli 0.1.3
          dart pub global activate very_good_cli 1.5.0
          mason get
          mason make very_good_dart_cli -c ${{ matrix.config }} --on-conflict overwrite -o ${{ matrix.output }}

      - name: 📦 Install Dependencies
        run: dart pub get --directory ${{ matrix.resolve_in }}

      - name: ✨ Check Formatting
        run: dart format --set-exit-if-changed ${{ matrix.output }}

      - name: 🕵️ Analyze
        run: dart analyze --fatal-infos --fatal-warnings ${{ matrix.output }}

      - name: 🧪 Run Tests
        run: |
          cd ${{ matrix.output }}
          very_good dart test --coverage --check-ignore --report-on="lib" -x version-verify

      - name: 🔎 Verify Generated Version
        run: |
          cd ${{ matrix.output }}
          dart run test --run-skipped -t version-verify
