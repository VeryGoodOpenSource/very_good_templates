name: very_good_flutter_plugin

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - .github/workflows/very_good_flutter_plugin.yaml
      - "very_good_flutter_plugin/**"
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/very_good_flutter_plugin.yaml
      - "very_good_flutter_plugin/**"
    branches:
      - main

jobs:
  brick:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - android
          - ios
          - macos
          - linux
          - web
          - windows
          - darwin

    name: brick (${{ matrix.platform }})

    defaults:
      run:
        working-directory: very_good_flutter_plugin/

    runs-on: ubuntu-latest

    env:
      OUTPUT: very_good_flutter_plugin_${{ matrix.platform }}_output

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          cache: true
          flutter-version: "3.47.x"

      - name: 🧱 Mason Make
        run: |
          dart pub global activate mason_cli 0.1.3
          dart pub global activate very_good_cli 1.1.1
          mason get
          mason make very_good_flutter_plugin -c config.json --on-conflict overwrite --platforms ${{ matrix.platform }} -o $OUTPUT

      - name: 📦 Install Dependencies
        run: very_good packages get --recursive $OUTPUT

      - name: ✨ Check Formatting
        run: dart format --set-exit-if-changed $OUTPUT

      - name: 🕵️ Analyze
        run: dart analyze --fatal-infos --fatal-warnings $OUTPUT

      - name: 🧪 Run Tests
        run: |
          cd $OUTPUT
          very_good test -r --coverage --test-randomize-ordering-seed random --exclude-coverage '**/*.g.dart **/*.gen.dart' --collect-coverage-from=all

  # Temporary harness for the Fluttium replacement spike (issue #484).
  # Generates the plugin for one platform into a directory next to the
  # checkout, matching the layout of a generated repository, then runs the
  # same e2e steps as the generated workflow. Steps prefixed with "harness:" exist only here and
  # are excluded from timing comparisons.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tool: fluttium, platform: android, runner: ubuntu-latest }
          - { tool: fluttium, platform: ios, runner: macos-latest }
          - { tool: fluttium, platform: macos, runner: macos-latest }
          - { tool: fluttium, platform: web, runner: ubuntu-latest }
          - { tool: fluttium, platform: windows, runner: windows-latest, shell: pwsh }

    name: e2e (${{ matrix.tool }}, ${{ matrix.platform }})

    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        # The generated Windows jobs use the default pwsh shell, which also
        # resolves the .bat shims pub creates for global executables.
        shell: ${{ matrix.shell || 'bash' }}
        working-directory: ../e2e/very_good_flutter_plugin_output/example

    steps:
      - name: "harness: Enable long paths"
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
        working-directory: .

      - name: "harness: Git Checkout"
        uses: actions/checkout@v7

      - name: "harness: Setup Flutter"
        uses: subosito/flutter-action@v2.23.0
        with:
          cache: true
          flutter-version: "3.47.x"

      - name: "harness: Mason Make"
        working-directory: very_good_flutter_plugin/
        run: |
          dart pub global activate mason_cli 0.1.3
          dart pub global activate very_good_cli 1.1.1
          mason get
          mason make very_good_flutter_plugin -c config.json --on-conflict overwrite --platforms ${{ matrix.platform }} -o ../../e2e

      # Fluttium: mirrors the jobs in
      # very_good_flutter_plugin/__brick__/.github/workflows/{{project_name.snakeCase()}}.yaml
      - if: matrix.tool == 'fluttium' && matrix.platform == 'android'
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Install Fluttium
        if: matrix.tool == 'fluttium'
        run: flutter pub global activate fluttium_cli

      - name: Enable KVM
        if: matrix.tool == 'fluttium' && matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD Cache
        if: matrix.tool == 'fluttium' && matrix.platform == 'android'
        uses: actions/cache@v3
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-29

      - name: Cache AVD Snapshot
        if: matrix.tool == 'fluttium' && matrix.platform == 'android' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: E2E Tests
        if: matrix.tool == 'fluttium' && matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          script: fluttium test flows/test_platform_name.yaml -d android
          working-directory: ../e2e/very_good_flutter_plugin_output/example

      - name: Start Simulator
        if: matrix.tool == 'fluttium' && matrix.platform == 'ios'
        # Start an iPhone simulator
        run: |
          UDID=$(xcrun xctrace list devices | grep "^iPhone" | awk '{gsub(/[()]/,""); print $NF}' | head -n 1)
          echo $UDID
          xcrun simctl boot "${UDID:?No Simulator with this name found}"

      - name: E2E Tests
        if: matrix.tool == 'fluttium' && matrix.platform == 'ios'
        run: fluttium test flows/test_platform_name.yaml -d iPhone

      - name: E2E Tests
        if: matrix.tool == 'fluttium' && matrix.platform == 'macos'
        run: fluttium test flows/test_platform_name.yaml -d macos

      - name: E2E Tests
        if: matrix.tool == 'fluttium' && matrix.platform == 'web'
        run: xvfb-run fluttium test flows/test_platform_name.yaml -d chrome

      - name: E2E Tests
        if: matrix.tool == 'fluttium' && matrix.platform == 'windows'
        run: fluttium test flows/test_platform_name.yaml -d windows
